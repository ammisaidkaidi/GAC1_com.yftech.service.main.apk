#白天默认亮度
default.day.mode.screen.brightness=175
#黑夜默认亮度
default.night.mode.screen.brightness=50
#自定义按键键值
default.custom.key.value=7
#声场默认值
default.sound.field.fl.value=0
default.sound.field.fr.value=0
default.sound.field.rl.value=0
default.sound.field.rr.value=0

#MIC1增益值(0~6db)
default.mic1.hw.gain=0
#MIC2增益值(0~6db)
default.mic2.hw.gain=0

#默认EQ类型
default.eq.type=1
#默认EQ打开关闭
default.eq.enable=true
#默认DTS打开关闭
default.dts.enable=false
#默认DTS类型
default.dts.type=0
#默认DTS最佳听音位
default.dts.sound.position=2

#声场平衡默认值
default.balance.fl=131072
default.balance.fr=131072
default.balance.rl=131072
default.balance.rr=131072
#响度默认开关
default.balance.enable=false
